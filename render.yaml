services:
  - type: web
    name: samruddhi-setu
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npx prisma db push --schema server/prisma/schema.prisma && npm run db:seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: samruddhi-setu-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: samruddhi-setu-db
    plan: free
    postgresMajorVersion: 16
