services:
  - type: web
    name: farmtofork
    env: node
    plan: free
    buildCommand: npm run build
    preDeployCommand: npx prisma db push --schema server/prisma/schema.prisma && npm run db:seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: farmtofork-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: farmtofork-db
    plan: free
    postgresMajorVersion: 16
