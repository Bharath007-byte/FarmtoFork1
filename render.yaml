services:
  - type: web
    name: samruddhi-setu
    env: node
    plan: free
    buildCommand: npm install --prefix frontend --include=dev --legacy-peer-deps && npm run build --prefix frontend && npm install --prefix server --include=dev --legacy-peer-deps && npm run db:generate --prefix server && npm run build --prefix server && npm run db:push --prefix server
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: samruddhi-setu-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: samruddhi-setu-db
    plan: free
    postgresMajorVersion: 16
