name: FarmtoFork CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build Frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Install and Build Server
        run: |
          cd server
          npm install --legacy-peer-deps
          npx prisma generate
          npm run build
